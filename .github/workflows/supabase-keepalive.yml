name: Supabase keep-alive

# Empêche la mise en pause des projets Supabase free-tier (seuil ≈ 7 jours d'inactivité).
# DÉSARMÉ PAR DÉFAUT (24/09/2026) : la vraie tâche tourne sur le VPS (minuteur systemd). Ce doublon
# ne démarre que si la variable de dépôt DTP_KEEPALIVE_GITHUB vaut 'oui' — voir le `if:` du job.

on:
  schedule:
    - cron: '23 7 * * *'      # tous les jours à 07:23 UTC (off top-of-hour → moins de retard de planif)
    - cron: '23 19 * * *'     # + 2e passage à 19:23 UTC → 2 pings/jour, marge énorme vs seuil de 7 j (résiste à un run raté/retardé)
  workflow_dispatch: {}        # bouton « Run workflow » pour tester à la demande

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    # N'exécute QUE sur le dépôt d'origine ; le miroir « backup » ne doit pas pinger en double.
    #
    # ⚠️ ET SEULEMENT SI UNE CLÉ EST RÉELLEMENT POSÉE (03/09/2026, l'utilisateur reçoit les courriels
    # d'échec). Rappel de l'enchaînement, parce qu'il est instructif : ce job a tourné 142 fois en
    # vert SANS RIEN PINGUER, ses secrets n'ayant jamais été posés — et le projet principal est resté
    # en pause deux mois et demi sous une coche verte quotidienne. Le 02/09 le script a été corrigé
    # pour SORTIR EN ERREUR quand il n'a rien à pinguer : plus jamais de faux vert. Correct, et
    # bruyant — depuis, chaque passage envoie un courriel d'échec pour une situation connue et
    # assumée : la vraie tâche tourne sur le VPS, où les clés vivent déjà.
    # Un signal d'alerte qu'on apprend à ignorer ne protège plus rien : c'est la même maladie que le
    # faux vert, dans l'autre sens. Le job NE DÉMARRE DONC PLUS tant qu'aucune clé n'est posée — il
    # est « ignoré », ce qui ne notifie personne et ne prétend rien. Le jour où un secret
    # SUPABASE_URL est ajouté, la ceinture-bretelles se réarme toute seule, sans toucher à ce fichier.
    # ⚠️ LE SCRIPT, LUI, GARDE SON ÉCHEC BRUYANT : c'est sur le VPS qu'il doit hurler s'il n'a rien à
    # pinguer, puisque c'est là qu'il est censé marcher. On désarme le doublon, jamais la garde.
    #
    # ⚠️⚠️ ET LE « SI » NE PEUT PAS LIRE `secrets` (04/09/2026) — LA MÊME MALADIE, AU TROISIÈME TOUR.
    # La correction ci-dessus était juste dans son intention et FAUSSE dans sa forme : GitHub n'expose
    # PAS le contexte `secrets` dans un `if:` de JOB (il n'existe qu'au niveau des étapes et des
    # `env:`). Le fichier devenait donc INVALIDE, et un fichier invalide ne « saute » pas : GitHub
    # crée un passage ROUGE, sans le moindre job, à CHAQUE poussée sur main. Mesuré le 04/09 sur les
    # cinq derniers passages (nos 157 à 161) : tous en échec, tous à zéro job, tous avec `created_at`
    # égal à `updated_at` — et le passage porte le CHEMIN du fichier au lieu de son `name:`, preuve
    # qu'il n'a jamais été lu. On voulait supprimer un courriel d'échec quotidien : on en avait ajouté
    # un par poussée. La garde ne change pas d'intention, seulement d'endroit : le secret est lu dans
    # un `env:` de job (autorisé), et ce sont les ÉTAPES qui se sautent. Le passage est alors VERT et
    # muet, ce qui est exactement ce qui était demandé, et le job se réarme tout seul le jour où un
    # secret est posé.
    #
    # ⚠️ MINUTES ACTIONS (24/09/2026, urgence : 1 800 / 2 000 min consommées). « Démarrer puis sauter
    # toutes les étapes » n'est PAS gratuit : GitHub facture chaque job démarré à la minute
    # supérieure — deux passages par jour, ~60 min par mois, pour ne rien faire (la vraie tâche
    # tourne sur le VPS). Un `if:` de JOB peut lire `vars` (contrairement à `secrets`) : le job ne
    # démarre plus du tout tant que la variable de dépôt DTP_KEEPALIVE_GITHUB ne vaut pas 'oui'.
    # Job « ignoré » = zéro minute, aucun courriel. Pour le réarmer : Settings › Secrets and
    # variables › Actions › Variables › DTP_KEEPALIVE_GITHUB = oui (et poser SUPABASE_URL/KEY).
    if: ${{ github.repository == 'byVolrod/datatradingpro-v2' && vars.DTP_KEEPALIVE_GITHUB == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Le seul endroit où `secrets` est lisible avant les étapes. Rend la CHAÎNE 'true' ou 'false'.
      DTP_CLE_POSEE: ${{ secrets.SUPABASE_URL != '' }}
    steps:
      - name: Checkout
        if: ${{ env.DTP_CLE_POSEE == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.DTP_CLE_POSEE == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ping all Supabase projects
        if: ${{ env.DTP_CLE_POSEE == 'true' }}
        # SECRETS_JSON = TOUTES les secrets du dépôt → le script détecte automatiquement
        # SUPABASE_URL[_n] / SUPABASE_KEY[_n]. Ajouter une base = ajouter un secret, AUCUNE modif ici.
        # (Les valeurs des secrets sont masquées dans les logs par GitHub.)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          SUPABASE_KEEPALIVE_TABLE: ${{ vars.SUPABASE_KEEPALIVE_TABLE }}
        run: node scripts/supabase-keepalive.js
