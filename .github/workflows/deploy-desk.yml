name: Déployer le desk

# ═══ POURQUOI CE WORKFLOW EXISTE ════════════════════════════════════════════════════════════════
#
#   Le desk se déploie par SSH depuis une machine qui détient ~/.ssh/dtp_deploy. Tant que cette
#   machine est la vôtre et elle seule, déployer suppose d'être devant elle — et treize commits ont
#   attendu une journée entière pour cette seule raison, dont la réparation de trente et une
#   annonces fautives que les clients lisaient pendant ce temps.
#
#   Ce workflow ouvre une SECONDE porte : le bouton « Run workflow » de l'onglet Actions. Depuis un
#   téléphone, depuis un autre poste, ou depuis un agent qui n'a pas vos clés.
#
# ⚠️ POUSSER SUR MAIN DÉPLOIE (décision user du 29/08 : « retrouver le push = prod comme sur
#   Render » — oui explicite, l'ancienne règle « pousser ne déploie pas » du 27/08 est LEVÉE).
#   Chaque push sur `main` déclenche ce workflow ; le bouton « Run workflow » reste pour relancer
#   à la main. L'objection qui fondait l'ancienne règle (« un correctif à moitié fini partirait
#   chez les clients ») est traitée AUTREMENT : le job fait tourner `npm run check` — les 36 bancs
#   du dépôt — AVANT de toucher au VPS. Un push qui casse un banc est BLOQUÉ, pas déployé.
#   Ce qui reste interdit : `schedule` (un déploiement à heure fixe sans nouveau code redémarrerait
#   la prod pour rien) et tout autre déclencheur. Un banc (scripts/deploiement-verif.js) exige
#   EXACTEMENT { push sur main + workflow_dispatch }, et la présence de la garde npm run check.
#
# ═══ COMMENT LA PROD REÇOIT LE CODE : LE JALON prod-ready (30/08, « la méthode à l'ancienne ») ═══
#   L'utilisateur veut le comportement Render : je valide, on pousse, le site se met à jour — sans
#   manipuler de clé. Render y arrivait parce que c'est LUI qui tirait le dépôt. On refait pareil :
#     1. ce workflow, une fois `npm run check` VERT, avance le tag `prod-ready` sur le commit
#        validé (le GITHUB_TOKEN automatique suffit : AUCUN secret à poser) ;
#     2. sur le VPS, un minuteur systemd (scripts/vps-autodeploiement.sh, posé UNE fois par
#        scripts/vps-autodeploiement-installer.sh) tire ce tag chaque minute et, quand il a bougé,
#        rejoue la séquence de déploiement locale (reset → build → up → /healthz).
#   Résultat : push sur main → bancs verts → prod à jour ~2 min plus tard. Aucune clé nulle part.
#
#   LE CHEMIN SSH RESTE EN OPTION (plus rapide d'une minute, rien de plus) : si un jour le secret
#   DTP_SSH_KEY est posé (Réglages → Secrets and variables → Actions ; + variable DTP_KNOWN_HOSTS
#   via `ssh-keyscan -t ed25519 149.71.44.90`), les étapes SSH ci-dessous s'activent et poussent
#   directement. SANS le secret, elles se SAUTENT proprement : le run reste VERT, le jalon suffit.
#
# ⚠️ IL N'Y A QU'UNE IMPLÉMENTATION PAR CHEMIN, et ce fichier n'en recopie aucune.
#   Chemin SSH → il appelle `scripts/deploy.sh`. Chemin jalon → la séquence locale vit dans
#   `scripts/vps-autodeploiement.sh`, et un banc (deploiement-verif) vérifie que les commandes
#   cœur des deux scripts restent IDENTIQUES : deux vérités qui divergent se paieraient sur la
#   machine qui sert les clients.
#
# ⚠️ SUR LA CLÉ (si elle est posée un jour) : la brider dans ~/.ssh/authorized_keys du VPS avec
#   command="…séquence de déploiement…",no-agent-forwarding,no-port-forwarding,no-pty — une clé
#   bridée ne peut RIEN faire d'autre, même volée (le dépôt a déjà payé une clé compromise).

on:
  push:
    branches: [main]          # push = prod (et main SEULEMENT : une branche de session ne déploie pas)
  workflow_dispatch:
    inputs:
      raison:
        description: "Pourquoi ce déploiement (apparaît dans le journal)"
        required: false
        default: "déploiement manuel"

permissions:
  contents: write             # nécessaire UNIQUEMENT pour avancer le tag prod-ready (le jalon que le VPS tire)

# Deux déploiements ne doivent JAMAIS se chevaucher : le second ferait un `git reset --hard`
# pendant que le premier construit son image. `cancel-in-progress: false` — interrompre un
# déploiement à mi-course est pire que d'attendre le suivant.
concurrency:
  group: deploy-desk
  cancel-in-progress: false

jobs:
  deployer:
    # Le miroir « backup » est un dépôt privé identique : sans ce garde-fou, il pourrait déployer
    # lui aussi. Même protection que le keep-alive Supabase.
    if: ${{ github.repository == 'byVolrod/datatradingpro-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ═══ LA GARDE QUI REMPLACE L'ANCIENNE RÈGLE ═══════════════════════════════════════════════
      # Le push déploie, mais JAMAIS un push cassé : les 36 bancs du dépôt tournent d'abord. Les
      # bancs à navigateur s'abstiennent proprement quand Chromium manque (conçu ainsi) ; tout le
      # reste — syntaxe, identifiants fantômes, i18n, annonces, taux, pourcent — bloque au rouge.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: npm run check — un push cassé ne part pas en prod
        run: npm run check

      # ═══ LE JALON : la version VALIDÉE que le VPS vient tirer tout seul ═══════════════════════
      # Après les bancs verts SEULEMENT (l'ordre est éprouvé par le banc de déploiement) : le tag
      # `prod-ready` avance sur ce commit. Le minuteur du VPS le voit bouger dans la minute et
      # redéploie — c'est LE mécanisme « push = prod » ; aucun secret, aucune clé.
      - name: Publier le jalon prod-ready — le VPS tire cette version
        run: |
          git tag -f prod-ready ${{ github.sha }}
          git push -f origin refs/tags/prod-ready
          echo "Jalon prod-ready → ${{ github.sha }} (le VPS le tire dans la minute si le tireur est installé)"

      - name: Vérifier que la clé est posée
        id: cle
        # La clé n'est PLUS obligatoire (30/08) : sans elle, le déploiement passe par le JALON
        # ci-dessus — le run reste VERT. Avec elle, les étapes SSH ci-dessous poussent en direct
        # (gain : ~1 min). On le dit tout de suite, sans échouer.
        run: |
          if [ -z "${{ secrets.DTP_SSH_KEY }}" ]; then
            echo "::notice::Secret DTP_SSH_KEY absent — déploiement par le jalon prod-ready (le VPS tire la version validée ; aucune clé requise)."
            echo "presente=non" >> "$GITHUB_OUTPUT"
          else
            echo "presente=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé SSH
        if: steps.cle.outputs.presente == 'oui'
        env:
          CLE: ${{ secrets.DTP_SSH_KEY }}
          HOTES_CONNUS: ${{ vars.DTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # `printf %s` et non `echo` : une clé se termine par un saut de ligne que `echo -n`
          # mangerait et qu'OpenSSH refuse ensuite (« invalid format »).
          printf '%s\n' "$CLE" > ~/.ssh/dtp_deploy
          chmod 600 ~/.ssh/dtp_deploy
          if [ -n "$HOTES_CONNUS" ]; then
            printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Empreinte du VPS ÉPINGLÉE (variable DTP_KNOWN_HOSTS)."
          else
            echo "::warning::DTP_KNOWN_HOSTS n'est pas posée — la première connexion acceptera"
            echo "l'empreinte sans la vérifier. Poser : ssh-keyscan -t ed25519 <hôte>"
          fi

      - name: Déployer
        if: steps.cle.outputs.presente == 'oui'
        # ⚠️ ON APPELLE LE SCRIPT, ON NE LE RECOPIE PAS. `scripts/deploy.sh` porte la séquence
        #    (fetch → reset → build → up), les garde-fous et l'attente de /healthz. Il lit ses
        #    réglages dans l'environnement : c'est exactement la couture prévue pour ce cas.
        env:
          DTP_KEY: /home/runner/.ssh/dtp_deploy
          DTP_HOST: ${{ vars.DTP_HOST }}
          DTP_DIR: ${{ vars.DTP_DIR }}
          DTP_URL: ${{ vars.DTP_URL }}
        run: |
          echo "Raison : ${{ inputs.raison || 'push sur main (déploiement automatique)' }}"
          # Une variable de dépôt non posée arrive comme chaîne VIDE, pas comme variable absente :
          # `${DTP_HOST:-défaut}` du script ne se déclencherait donc jamais et l'hôte serait vide.
          # On retire ici ce qui est vide, pour rendre au script ses valeurs par défaut.
          for v in DTP_HOST DTP_DIR DTP_URL; do
            eval "[ -n \"\${$v}\" ] || unset $v"
          done
          bash scripts/deploy.sh

      - name: Effacer la clé
        # `always()` : la clé disparaît même si le déploiement a échoué. Le runner est jetable,
        # mais une étape suivante ajoutée un jour n'a aucune raison de la trouver là.
        if: always()
        run: rm -f ~/.ssh/dtp_deploy
