name: Sonde taux (diagnostic)

# ═══ POURQUOI CE WORKFLOW EXISTE ═════════════════════════════════════════════════════════════════
# Le conteneur de développement ne peut PAS joindre rateprobability.com (proxy de sortie), et le
# VPS n'est pas joignable non plus depuis lui. Or il faut VOIR les payloads réels des slugs rbnz
# et snb pour comprendre pourquoi ces deux banques retombent en « estimation DTP » quand les six
# autres ont du pricing de marché (signalement client MaTToKs, 28/08). Le runner GitHub, lui,
# sort librement : ce workflow interroge l'API publique et imprime la STRUCTURE des réponses
# (clés, champs scalaires, première ligne) — jamais un dump intégral. Données de marché publiques,
# aucun secret. Déclenchement MANUEL uniquement : c'est un instrument, pas une tâche.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonder:
    if: ${{ github.repository == 'byVolrod/datatradingpro-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Structure des payloads (les 8 banques)
        run: |
          for slug in fed ecb boe boj boc rba rbnz snb; do
            echo "═══════════ $slug ═══════════"
            code=$(curl -sS -o /tmp/p.json -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' \
              -H 'Accept: application/json' \
              -H 'Referer: https://rateprobability.com/' \
              "https://rateprobability.com/api/$slug/latest") || { echo "curl KO"; continue; }
            echo "HTTP $code · $(wc -c </tmp/p.json) octets"
            jq -r '"clés racine : \(keys)"' /tmp/p.json 2>/dev/null || { echo "JSON invalide :"; head -c 400 /tmp/p.json; echo; continue; }
            jq -r '.error // empty | "error : \(.)"' /tmp/p.json
            jq -r '.upgrade // empty | "upgrade : \(.)"' /tmp/p.json
            jq -r 'select(.today != null) | .today | "clés today : \(keys)"' /tmp/p.json
            jq -r 'select(.today != null) | .today | to_entries[] | select((.value|type) != "array" and (.value|type) != "object") | "  \(.key) = \(.value)"' /tmp/p.json
            echo "nb rows : $(jq -r '.today.rows | length' /tmp/p.json 2>/dev/null)"
            echo "row[0] : $(jq -c '.today.rows[0]' /tmp/p.json 2>/dev/null | head -c 600)"
          done
      # Demande user du 30/08 (« Check ici aussi https://rateprobability.com/ ») : la STRUCTURE des
      # pages publiques — le site montre-t-il rbnz/snb hors API, à quel prix l'offre Pro ? Toujours
      # des extraits ciblés (titres, mentions Pro, tarifs), jamais un dump de page.
      - name: Pages publiques (structure)
        run: |
          for p in "" pro rbnz snb; do
            url="https://rateprobability.com/$p"
            echo "═══════════ /$p ═══════════"
            code=$(curl -sSL -o /tmp/h.html -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' \
              "$url") || { echo "curl KO"; continue; }
            echo "HTTP $code · $(wc -c </tmp/h.html) octets"
            echo "titre : $(grep -oiE '<title>[^<]*' /tmp/h.html | head -1 | sed 's/<title>//I')"
            echo "h1-h2 : $(grep -oiE '<h[12][^>]*>[^<]{3,90}' /tmp/h.html | sed -E 's/<[^>]*>//g' | head -8 | paste -sd ' | ' -)"
            echo "mentions Pro / tarif :"
            grep -oiE '[^<>]{0,70}(pro subscription|upgrade to pro|per month|/month|/mo\b|\$[0-9]+([.,][0-9]{2})?)[^<>]{0,70}' /tmp/h.html | head -8
            echo "banques citées : $(grep -oiE '\b(fed|ecb|boe|boj|boc|rba|rbnz|snb)\b' /tmp/h.html | tr 'A-Z' 'a-z' | sort | uniq -c | paste -sd ' ' -)"
            echo "traces de probabilités : $(grep -oE '[0-9]{1,3}\.[0-9]%' /tmp/h.html | head -10 | paste -sd ' ' -)"
          done


      # ═══ SOURCES LÉGITIMES DE TAUX (23/09) ═══════════════════════════════════════════════════════
      # rateprobability bloque les robots (défi Cloudflare) → on N'Y TOUCHE PLUS. On valide ici, sur le
      # runner (sortie internet libre), ce que rendent les sources qui AUTORISENT l'accès programmatique :
      #   · Polymarket Gamma (API publique, lecture libre) — quels marchés de décision de banque centrale ?
      #   · ASX RBA Rate Tracker (page publique, pas de mur) — quelle donnée exploitable ?
      #   · Yahoo Finance (déjà utilisé pour les futures Fed Funds ZQ) — quels symboles STIR pour les
      #     autres banques (Euribor, SONIA, BAX, ASX IB) rendent une donnée ?
      # But : savoir EXACTEMENT quoi brancher AVANT d'écrire le moteur, banque par banque.
      - name: Polymarket Gamma — marchés de décision de banque centrale
        run: |
          for q in "fed" "ecb" "bank-of-england" "interest-rate" "central-bank"; do
            echo "═══ recherche tag/slug: $q ═══"
            curl -s -m 20 "https://gamma-api.polymarket.com/events?closed=false&active=true&limit=6&tag_slug=$q" \
              | jq -r 'if type=="array" then (.[] | "• \(.title)  [id \(.id)]  \((.markets // []) | length) marché(s)") else "(réponse non-array) \(.|tostring|.[0:200])" end' 2>/dev/null | head -12 || echo "jq KO"
          done
          echo "═══ un événement en détail (structure des probabilités) ═══"
          ev=$(curl -s -m 20 "https://gamma-api.polymarket.com/events?closed=false&active=true&limit=1&tag_slug=fed" | jq -r '.[0].id' 2>/dev/null)
          echo "event id: $ev"
          curl -s -m 20 "https://gamma-api.polymarket.com/events?id=$ev" \
            | jq -r '.[0].markets[]? | "  \(.question) → outcomes \(.outcomes)  prix \(.outcomePrices)  last \(.lastTradePrice)"' 2>/dev/null | head -20 || true
      - name: ASX RBA Rate Tracker — donnée exploitable
        run: |
          echo "═══ page RBA Rate Tracker (embarque-t-elle un JSON / une API ?) ═══"
          curl -sSL -m 20 -o /tmp/asx.html -w "HTTP %{http_code} · %{size_download} o\n" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' \
            "https://www.asx.com.au/markets/trade-our-derivatives-market/futures-market/rba-rate-tracker" || echo KO
          echo "titre : $(grep -oiE '<title>[^<]*' /tmp/asx.html | head -1 | sed 's/<title>//I')"
          echo "URLs de données citées dans la page :"
          grep -oiE 'https?://[a-z0-9./_-]*(api|data|markit|json|curve|expectation)[a-z0-9./_?=-]*' /tmp/asx.html | sort -u | head -15
          echo "═══ endpoints candidats (JSON direct ?) ═══"
          for u in \
            "https://asx.api.markitdigital.com/asx-research/1.0/companies/rba-rate-tracker" \
            "https://www.asx.com.au/data/trt/ib_expectation_curve_graph.json"; do
            echo "— $u"; curl -s -m 15 -o /tmp/a.json -w "  HTTP %{http_code} · %{size_download} o\n" "$u"; head -c 160 /tmp/a.json 2>/dev/null; echo
          done
      - name: Yahoo Finance — symboles STIR des autres banques
        run: |
          # Fed ZQ = référence connue (marche). On teste des candidats pour ECB/BoE/BoC/RBA.
          for sym in "ZQ=F" "GE=F" "FEI=F" "I=F" "L=F" "SO3=F" "BAX=F" "IR=F" "YIB=F"; do
            u="https://query1.finance.yahoo.com/v8/finance/chart/$sym?interval=1d&range=5d"
            code=$(curl -s -m 15 -o /tmp/y.json -w '%{http_code}' -H 'User-Agent: Mozilla/5.0' "$u")
            px=$(jq -r '.chart.result[0].meta.regularMarketPrice // "—"' /tmp/y.json 2>/dev/null)
            nm=$(jq -r '.chart.result[0].meta.shortName // .chart.result[0].meta.symbol // "?"' /tmp/y.json 2>/dev/null)
            echo "$sym → HTTP $code · prix $px · $nm"
          done
