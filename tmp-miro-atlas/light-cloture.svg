<textArea id="m3458764682167868714" data-miro-id="3458764682167868714" x="370" y="1505" width="500" height="24" fill="#b8860b" font-family="formular" font-size="17" text-align="center" font-weight="bold">&lt;u&gt;S&amp;#39;il y a un risque de retournement au TP&lt;/u&gt;</textArea>
