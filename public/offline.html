<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DataTradingPro — hors ligne</title>
<!-- PAGE AUTONOME, ET C'EST TOUT L'INTÉRÊT (04/09). Elle s'affiche quand le réseau est tombé :
     elle ne peut donc dépendre d'AUCUN fichier externe — ni la feuille du desk, ni une police, ni
     une icône distante. Tout est en ligne dans ce fichier. Une page hors-ligne qui a besoin du
     réseau pour s'afficher est un contresens qu'on ne découvre que le jour où elle sert. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #0c0c0e; color: #e8eaed;
    font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 28px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .c { max-width: 380px; text-align: center; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
       font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #b8860b; margin: 0 0 18px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 12px; color: #fff; }
  p { font-size: 14px; line-height: 1.65; color: #9aa3b2; margin: 0 0 10px; }
  .d { display: inline-flex; align-items: center; gap: 8px; margin: 22px 0 0; padding: 9px 16px;
       border: 1px solid #1c1c20; border-radius: 999px; font-size: 12.5px; color: #8b93a1; }
  .d i { width: 7px; height: 7px; border-radius: 50%; background: #ffb300; display: block;
         animation: p 1.9s ease-in-out infinite; }
  @keyframes p { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .d i { animation: none; opacity: .8 } }
  button { margin-top: 20px; background: #e3b23a; color: #0c0c0e; border: 0; border-radius: 6px;
           padding: 12px 26px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="c">
    <p class="m">DataTradingPro</p>
    <h1>Connexion perdue</h1>
    <p>Le desk a besoin du réseau : les cours, le calendrier et le fil sont des données <strong style="color:#c8ccd4">en direct</strong>.</p>
    <p>Rien n'est affiché en mémoire, volontairement — un chiffre de marché périmé serait plus trompeur qu'un écran vide.</p>
    <div class="d"><i></i><span id="e">Recherche du réseau…</span></div>
    <br><button type="button" onclick="location.reload()">Réessayer</button>
  </div>
<script>
  // Le retour du réseau recharge le desk tout seul : dans un métro ou un ascenseur, la coupure dure
  // quelques secondes et personne n'a envie de surveiller un bouton.
  var e = document.getElementById('e');
  function etat() {
    if (navigator.onLine) { e.textContent = 'Réseau retrouvé — rechargement…'; setTimeout(function () { location.reload(); }, 400); }
    else { e.textContent = 'Recherche du réseau…'; }
  }
  window.addEventListener('online', etat);
  setInterval(etat, 3000);
  etat();
</script>
</body>
</html>
