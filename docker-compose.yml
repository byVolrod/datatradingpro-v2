# ─────────────────────────────────────────────────────────────────────
#  DataTradingPro : Container Manager / VPS Docker
#  Construit l'image (Chromium inclus) et lance le serveur en permanence.
# ─────────────────────────────────────────────────────────────────────
services:
  datatradingpro:
    build: .
    # ⚠️ NOM D'IMAGE EXPLICITE : sans lui, Compose forge un nom derive du dossier, imprevisible
    # d'une machine a l'autre. Le nom fixe rend l'image TRANSFERABLE : lors d'une migration on
    # peut l'envoyer telle quelle a la nouvelle machine (docker save/load) au lieu de la
    # reconstruire. Mesure : 8 a 20 min de construction contre quelques minutes de transfert.
    image: datatradingpro:actuel
    container_name: datatradingpro
    # Nettoie les verrous Chromium périmés (de l'ancien conteneur) AVANT de lancer le serveur
    # → puppeteer (FF-News, FJ, myfxbook) relance correctement après chaque redéploiement/redémarrage.
    command: sh -c "rm -f /app/.chrome_profile_fj/Singleton* /app/.chrome_profile_ff/Singleton* /app/.chrome_profile_myfxbook/Singleton* 2>/dev/null; exec node server.js"
    restart: unless-stopped          # redémarre tout seul (reboot NAS inclus)
    # ── PLAFOND SUR LES JOURNAUX ────────────────────────────────────────────────────────────
    # Le pilote par défaut de Docker (json-file) n'a AUCUNE limite de taille : le fichier de log
    # du conteneur grossit indéfiniment. Ici il ne pesait que 28 Mo — ce n'est donc PAS ce qui a
    # rempli le disque le 07/09/2026 (c'étaient les images et le cache de construction, désormais
    # purgés à chaque déploiement). On le borne quand même : ce serveur écrit beaucoup (scrapers,
    # WebSocket, IA), une boucle d'erreur bavarde suffirait à remplir 20 Go en une nuit, et la
    # panne qu'on vient de vivre a montré ce que coûte un disque plein — nginx tronque les
    # réponses en silence et le desk arrive nu. Cinq fichiers de 20 Mo = 100 Mo au maximum,
    # largement de quoi enquêter, et une cause de saturation définitivement fermée.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "3000:3000"                  # accès : http://IP-DU-NAS:3000
    env_file:
      - .env                         # tes secrets (Supabase, FJ, MFB, Anthropic…)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DATA_DIR=/app/data           # caches durables (anti-doublon emails) → survit aux redémarrages
    volumes:
      # Persistance : cookies Puppeteer + caches survivent aux redémarrages
      - ./data/chrome_fj:/app/.chrome_profile_fj
      - ./data/chrome_ff:/app/.chrome_profile_ff
      - ./data/chrome_myfxbook:/app/.chrome_profile_myfxbook
      - ./data/app:/app/data         # anti-doublon emails (cache_email_log.json) → 1 seul envoi, restarts inclus
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
