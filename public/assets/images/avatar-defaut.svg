<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Photo de profil non definie">
  <!-- AVATAR PAR DÉFAUT DTP — dessiné pour le desk, aucune image tierce (même règle que
       macro-ai-spark.svg). Silhouette sourde sur fond sombre : elle se lit comme un emplacement
       VIDE, pas comme une identité, et c'est le but — un rond qui ressemble à une photo
       n'inviterait personne à en poser une. -->
  <defs>
    <clipPath id="dtp-av-rond"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <g clip-path="url(#dtp-av-rond)">
    <circle cx="32" cy="32" r="32" fill="#1a1a1f"/>
    <!-- tête -->
    <circle cx="32" cy="25" r="10.5" fill="#7d2b34"/>
    <!-- épaules : un arc large, coupé par le rond -->
    <path d="M32 38.5c-11.6 0-21 7.6-21 17v8.5h42V55.5c0-9.4-9.4-17-21-17z" fill="#7d2b34"/>
  </g>
</svg>
