<textArea id="m3458764682167868716" data-miro-id="3458764682167868716" x="370" y="1595" width="500" height="23" fill="#16181f" font-family="formular" font-size="16" text-align="center">Resserre ton SL (trailing agressif)</textArea>
<textArea id="m3458764682167868717" data-miro-id="3458764682167868717" x="320" y="1690" width="600" height="23" fill="#16181f" font-family="formular" font-size="16" text-align="center">Descends sur un &lt;b&gt;timeframe inférieur&lt;/b&gt; (ex. : H1 → M15 ou M5).</textArea>
