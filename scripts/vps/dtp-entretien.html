<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DTP</title>
<!-- PAGE DE TRANSITION (23/08, demande user : « cache l'erreur 502, camoufle »).
     Servie par NGINX depuis le disque du VPS via error_page 502/503/504 : elle s'affiche
     PRÉCISÉMENT quand l'app est indisponible (fenêtre de redéploiement ~30-60 s, crash).
     100 % AUTONOME : aucun asset externe (l'app est down, elle ne peut rien servir).
     Elle sonde /login.html toutes les 2 s et se recharge TOUTE SEULE dès que le desk répond :
     pour le client, la coupure devient un voile d'attente de quelques secondes aux couleurs
     DTP, plus jamais un « 502 Bad Gateway » nu. -->
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0d0e11;color:#eceef2;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center}
  .b{max-width:420px;padding:32px}
  /* Nom COMPLET, comme le loader du desk (règle user : « le loader doit avoir DataTradingPro
     affiché ») : cette page joue le rôle d'un écran de chargement, elle en porte l'identité. */
  .logo{font-size:26px;font-weight:800;letter-spacing:.04em;color:#e3b23a;margin-bottom:18px}
  h1{font-size:16px;font-weight:600;margin:0 0 8px;color:#eceef2}
  p{font-size:13px;line-height:1.55;color:#9a9aa4;margin:0 0 22px}
  .spin{width:26px;height:26px;margin:0 auto;border:3px solid rgba(227,178,58,.25);
    border-top-color:#e3b23a;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .pts{margin-top:14px;font-size:11px;color:#6f6f79;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="b">
    <div class="logo">DataTradingPro</div>
    <h1>Le desk se met à jour</h1>
    <p>Une amélioration est en train d'être déployée. Reconnexion automatique dans quelques secondes, vous n'avez rien à faire.</p>
    <div class="spin" aria-hidden="true"></div>
    <div class="pts" id="p"></div>
  </div>
<script>
(function(){
  var n=0, p=document.getElementById('p');
  function essai(){
    n++;
    if(p) p.textContent='tentative '+n;
    // Sonde LÉGÈRE et anti-cache : la page de login répond dès que le serveur est prêt.
    fetch('/login.html?sonde='+Date.now(),{method:'HEAD',cache:'no-store'})
      .then(function(r){ if(r.ok){ location.reload(); } else { setTimeout(essai,2000); } })
      .catch(function(){ setTimeout(essai,2000); });
  }
  setTimeout(essai,1500);
})();
</script>
</body>
</html>
