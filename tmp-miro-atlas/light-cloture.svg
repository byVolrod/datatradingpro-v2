<textArea id="m3458764682167868724" data-miro-id="3458764682167868724" x="410" y="1955" width="1100" height="40" fill="#b8860b" font-family="tiempos_text" font-size="28" text-align="center" font-weight="bold">&lt;i&gt;&lt;u&gt;Quand le prix s’approche d’un POI ou d’un POR&lt;/u&gt;&lt;/i&gt;</textArea>
<textArea id="m3458764682167868725" data-miro-id="3458764682167868725" x="180" y="2065" width="900" height="24" fill="#b8860b" font-family="formular" font-size="17" text-align="center" font-weight="bold">&lt;u&gt;Si tu peux manager et que c&amp;#39;est une zone claire avec une price action clean&lt;/u&gt;</textArea>
<textArea id="m3458764682167868726" data-miro-id="3458764682167868726" x="1150" y="2065" width="700" height="24" fill="#b8860b" font-family="formular" font-size="17" text-align="center" font-weight="bold">&lt;u&gt;Si ce n&amp;#39;est pas clair et que la price action est confuse&lt;/u&gt;</textArea>
