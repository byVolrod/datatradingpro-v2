<rect data-type="frame" x="0" y="0" width="2000" height="1250" fill="#ffffff" data-title="La sélection — Méthode JOT" />
<textArea id="m3458764682167788242" data-miro-id="3458764682167788242" x="804" y="93.6999999999998" width="392" height="79" fill="#b8860b" font-family="tiempos_text" font-size="56" text-align="center" font-weight="bold">SÉLECTION</textArea>
<textArea id="m3458764682167788243" data-miro-id="3458764682167788243" x="462.239999999998" y="200.8" width="186" height="34" fill="#16181f" font-family="formular" font-size="24" text-align="right">Le goal est de</textArea>
<textArea id="m3458764682167788244" data-miro-id="3458764682167788244" x="591" y="183.8" width="798" height="68" fill="#b8860b" font-family="formular" font-size="24" text-align="center" font-weight="bold">garder uniquement 2-4 setups cohérents et indépendants</textArea>
<textArea id="m3458764682167788245" data-miro-id="3458764682167788245" x="1340.22" y="183.8" width="205" height="68" fill="#16181f" font-family="formular" font-size="24" text-align="left">pour la semaine</textArea>
<rect id="m3458764682167788246" data-miro-id="3458764682167788246" x="490" y="430" width="200" height="76" data-content="RISQUE" rx="12" fill="#ff3d00" data-text-color="#ffffff" data-font-size="20" data-font-weight="bold" stroke="#1a1a1a" />
<rect id="m3458764682167788247" data-miro-id="3458764682167788247" x="1330" y="430" width="230" height="76" data-content="PROBABILITÉ" rx="12" fill="#f6f7f9" data-text-color="#16181f" data-font-size="20" data-font-weight="bold" stroke="#e3b23a" />
<textArea id="m3458764682167788248" data-miro-id="3458764682167788248" x="280" y="615" width="620" height="62" fill="#16181f" font-family="formular" font-size="22" text-align="center">&lt;i&gt;Tu ne peux pas être exposé 2-3 fois sur la même idée.&lt;/i&gt;</textArea>
<textArea id="m3458764682167788249" data-miro-id="3458764682167788249" x="1140" y="615" width="600" height="31" fill="#16181f" font-family="formular" font-size="22" text-align="center">&lt;i&gt;Tu veux le trade le plus évident, le plus clean.&lt;/i&gt;</textArea>
<textArea id="m3458764682167788250" data-miro-id="3458764682167788250" x="236" y="718.8" width="308" height="68" fill="#b8860b" font-family="formular" font-size="24" text-align="center" font-weight="bold">Corrélation Technique</textArea>
<textArea id="m3458764682167788251" data-miro-id="3458764682167788251" x="617.5" y="735.8" width="365" height="34" fill="#b8860b" font-family="formular" font-size="24" text-align="center" font-weight="bold">Corrélation Fondamentale</textArea>
<textArea id="m3458764682167788252" data-miro-id="3458764682167788252" x="170" y="790" width="440" height="23" fill="#16181f" font-family="formular" font-size="16" text-align="center" font-weight="bold">Si corrélation &amp;gt; 0.8, garde un seul setup.</textArea>
<textArea id="m3458764682167788253" data-miro-id="3458764682167788253" x="150" y="835" width="480" height="40" fill="#5f626e" font-family="formular" font-size="14" text-align="center">Ex : EURUSD &amp;amp; GBPUSD → même mouvement USD → choisis le plus propre.</textArea>
<textArea id="m3458764682167788254" data-miro-id="3458764682167788254" x="590" y="785" width="420" height="59" fill="#16181f" font-family="formular" font-size="14" text-align="center">Même si les paires ne sont pas corrélées,&lt;br /&gt;si elles tradent la &lt;b&gt;même idée fonda&lt;/b&gt;, tu n&amp;#39;en prends qu&amp;#39;une.</textArea>
<textArea id="m3458764682167788255" data-miro-id="3458764682167788255" x="660" y="835" width="280" height="40" fill="#5f626e" font-family="formular" font-size="14" text-align="center">Ex : AUDCHF &amp;amp; NZDCHF → risk-on.</textArea>
<textArea id="m3458764682167788256" data-miro-id="3458764682167788256" x="290" y="947.5" width="600" height="51" fill="#16181f" font-family="formular" font-size="18" text-align="center">Deux trades, une idée &amp;#61; double risque, pas double profit.</textArea>
<textArea id="m3458764682167788257" data-miro-id="3458764682167788257" x="1360" y="722.4" width="160" height="62" fill="#b8860b" font-family="formular" font-size="22" text-align="center" font-weight="bold">Price Action</textArea>
<textArea id="m3458764682167788258" data-miro-id="3458764682167788258" x="1255" y="761" width="370" height="56" fill="#16181f" font-family="formular" font-size="20" text-align="center">Lequel est le plus propre, fluide ?</textArea>
<textArea id="m3458764682167788259" data-miro-id="3458764682167788259" x="1395" y="847.9" width="90" height="31" fill="#b8860b" font-family="formular" font-size="22" text-align="center" font-weight="bold">Entrée</textArea>
<textArea id="m3458764682167788260" data-miro-id="3458764682167788260" x="1217.5" y="885" width="445" height="28" fill="#16181f" font-family="formular" font-size="20" text-align="center">Lequel est le plus naturel, sans forcer ?</textArea>
<textArea id="m3458764682167788261" data-miro-id="3458764682167788261" x="1338" y="942.4" width="204" height="62" fill="#b8860b" font-family="formular" font-size="22" text-align="center" font-weight="bold">Stop Placement</textArea>
<textArea id="m3458764682167788262" data-miro-id="3458764682167788262" x="1230" y="995" width="420" height="28" fill="#16181f" font-family="formular" font-size="20" text-align="center">Lequel est le plus logique et protégé ?</textArea>
<textArea id="m3458764682167788263" data-miro-id="3458764682167788263" x="1326" y="1067.9" width="228" height="31" fill="#b8860b" font-family="formular" font-size="22" text-align="center" font-weight="bold">RR (Risk/Reward)</textArea>
<textArea id="m3458764682167788264" data-miro-id="3458764682167788264" x="1267" y="1091" width="346" height="56" fill="#16181f" font-family="formular" font-size="20" text-align="center">Lequel offre le meilleur ratio ?</textArea>
</g>
