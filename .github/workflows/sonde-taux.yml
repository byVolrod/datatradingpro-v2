name: Sonde taux (diagnostic)

# ═══ POURQUOI CE WORKFLOW EXISTE ═════════════════════════════════════════════════════════════════
# Le conteneur de développement ne peut PAS joindre rateprobability.com (proxy de sortie), et le
# VPS n'est pas joignable non plus depuis lui. Or il faut VOIR les payloads réels des slugs rbnz
# et snb pour comprendre pourquoi ces deux banques retombent en « estimation DTP » quand les six
# autres ont du pricing de marché (signalement client MaTToKs, 28/08). Le runner GitHub, lui,
# sort librement : ce workflow interroge l'API publique et imprime la STRUCTURE des réponses
# (clés, champs scalaires, première ligne) — jamais un dump intégral. Données de marché publiques,
# aucun secret. Déclenchement MANUEL uniquement : c'est un instrument, pas une tâche.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonder:
    if: ${{ github.repository == 'byVolrod/datatradingpro-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Structure des payloads (les 8 banques)
        run: |
          for slug in fed ecb boe boj boc rba rbnz snb; do
            echo "═══════════ $slug ═══════════"
            code=$(curl -sS -o /tmp/p.json -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' \
              -H 'Accept: application/json' \
              -H 'Referer: https://rateprobability.com/' \
              "https://rateprobability.com/api/$slug/latest") || { echo "curl KO"; continue; }
            echo "HTTP $code · $(wc -c </tmp/p.json) octets"
            jq -r '"clés racine : \(keys)"' /tmp/p.json 2>/dev/null || { echo "JSON invalide :"; head -c 400 /tmp/p.json; echo; continue; }
            jq -r '.error // empty | "error : \(.)"' /tmp/p.json
            jq -r '.upgrade // empty | "upgrade : \(.)"' /tmp/p.json
            jq -r 'select(.today != null) | .today | "clés today : \(keys)"' /tmp/p.json
            jq -r 'select(.today != null) | .today | to_entries[] | select((.value|type) != "array" and (.value|type) != "object") | "  \(.key) = \(.value)"' /tmp/p.json
            echo "nb rows : $(jq -r '.today.rows | length' /tmp/p.json 2>/dev/null)"
            echo "row[0] : $(jq -c '.today.rows[0]' /tmp/p.json 2>/dev/null | head -c 600)"
          done
      # Demande user du 30/08 (« Check ici aussi https://rateprobability.com/ ») : la STRUCTURE des
      # pages publiques — le site montre-t-il rbnz/snb hors API, à quel prix l'offre Pro ? Toujours
      # des extraits ciblés (titres, mentions Pro, tarifs), jamais un dump de page.
      - name: Pages publiques (structure)
        run: |
          for p in "" pro rbnz snb; do
            url="https://rateprobability.com/$p"
            echo "═══════════ /$p ═══════════"
            code=$(curl -sSL -o /tmp/h.html -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36' \
              "$url") || { echo "curl KO"; continue; }
            echo "HTTP $code · $(wc -c </tmp/h.html) octets"
            echo "titre : $(grep -oiE '<title>[^<]*' /tmp/h.html | head -1 | sed 's/<title>//I')"
            echo "h1-h2 : $(grep -oiE '<h[12][^>]*>[^<]{3,90}' /tmp/h.html | sed -E 's/<[^>]*>//g' | head -8 | paste -sd ' | ' -)"
            echo "mentions Pro / tarif :"
            grep -oiE '[^<>]{0,70}(pro subscription|upgrade to pro|per month|/month|/mo\b|\$[0-9]+([.,][0-9]{2})?)[^<>]{0,70}' /tmp/h.html | head -8
            echo "banques citées : $(grep -oiE '\b(fed|ecb|boe|boj|boc|rba|rbnz|snb)\b' /tmp/h.html | tr 'A-Z' 'a-z' | sort | uniq -c | paste -sd ' ' -)"
            echo "traces de probabilités : $(grep -oE '[0-9]{1,3}\.[0-9]%' /tmp/h.html | head -10 | paste -sd ' ' -)"
          done

      # ═══ TEST NAVIGATEUR HEADLESS (23/09) ════════════════════════════════════════════════════════
      # MESURÉ : rateprobability est passé derrière un DÉFI CLOUDFLARE (« Just a moment… », HTTP 403)
      # qui bloque TOUTE requête sans navigateur — VPS, runner GitHub, allorigins, codetabs, jina.
      # Seul un vrai navigateur qui exécute le JS du défi peut passer (c'est ce que fait le desk pour
      # myfxbook). On VALIDE ici, sur le runner (IP datacenter, comme le VPS), qu'un Chromium headless
      # franchit le défi et lit le JSON — AVANT de brancher ce mécanisme dans le serveur.
      # Le headless simple ÉCHOUE (mesuré run #7 : « Performing security verification », jamais résolu)
      # → défi Cloudflare « Managed Challenge » qui détecte l'automatisation. On tente la parade la plus
      # forte SANS service payant : puppeteer-extra + plugin STEALTH, en HEADFUL sous xvfb (un vrai
      # affichage virtuel), UA et locale réalistes. C'est ce qui bat le plus souvent ce type de défi.
      - name: Navigateur furtif (puppeteer-extra stealth, headful xvfb)
        run: |
          npm i -s puppeteer@23 puppeteer-extra puppeteer-extra-plugin-stealth >/dev/null 2>&1
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          cat > /tmp/furtif.js <<'EOF'
          const puppeteer = require('puppeteer-extra');
          puppeteer.use(require('puppeteer-extra-plugin-stealth')());
          (async () => {
            const b = await puppeteer.launch({ headless: false, args: ['--no-sandbox', '--disable-setuid-sandbox', '--window-size=1280,900', '--lang=en-US'] });
            const p = await b.newPage();
            await p.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
            await p.setExtraHTTPHeaders({ 'Accept-Language': 'en-US,en;q=0.9' });
            try {
              // 1) On passe d'abord par la PAGE (le défi vise la navigation), puis on lit l'API en in-page.
              const r = await p.goto('https://rateprobability.com/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              console.log('status accueil :', r && r.status());
              let titre = '';
              for (let i = 0; i < 16; i++) { await new Promise(z => setTimeout(z, 3000)); titre = await p.title(); const corps = await p.evaluate(() => document.body ? document.body.innerText.slice(0, 60) : ''); if (!/just a moment|security verification/i.test(titre + corps)) { console.log('défi FRANCHI après ~' + ((i + 1) * 3) + ' s (titre: ' + titre + ')'); break; } }
              console.log('titre final :', titre);
              const j = await p.evaluate(async () => { try { const rr = await fetch('/api/fed/latest', { headers: { Accept: 'application/json' } }); return rr.status + ' :: ' + (await rr.text()).slice(0, 200); } catch (e) { return 'KO ' + e.message; } });
              console.log('IN-PAGE fed :', String(j).replace(/\s+/g, ' '));
            } catch (e) { console.log('ERREUR :', e.message); }
            await b.close();
          })();
          EOF
          xvfb-run -a --server-args="-screen 0 1280x900x24" node /tmp/furtif.js
